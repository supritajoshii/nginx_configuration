# Django/Gunicorn upstream.
# For one Gunicorn process:
upstream django_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Example multi-instance load balancing:
#
# upstream django_backend {
#     least_conn;
#     server 127.0.0.1:8000;
#     server 127.0.0.1:8001;
#     server 127.0.0.1:8002;
#     keepalive 32;
# }

# Uncomment/use this only for a Next.js SSR frontend:
#
# upstream nextjs_frontend {
#     server 127.0.0.1:3000;
#     keepalive 32;
# }
