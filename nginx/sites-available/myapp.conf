# ============================================================
# DJANGO PRODUCTION SITE
# Replace example.com and filesystem paths with your values.
# ============================================================

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;

    server_name example.com www.example.com;

    return 301 https://example.com$request_uri;
}

# HTTPS application
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # On Nginx versions that support it:
    http2 on;

    server_name example.com www.example.com;

    # --------------------------------------------------------
    # SSL / Let's Encrypt
    # --------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    include /etc/nginx/snippets/ssl.conf;

    # --------------------------------------------------------
    # Security headers
    # --------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enable HSTS only after confirming HTTPS works everywhere.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # --------------------------------------------------------
    # Upload limit
    # --------------------------------------------------------
    client_max_body_size 20M;

    # --------------------------------------------------------
    # Django static files
    # --------------------------------------------------------
    location /static/ {
        alias /var/www/myapp/static/;

        expires 30d;
        add_header Cache-Control "public, immutable";

        access_log off;
    }

    # --------------------------------------------------------
    # User-uploaded media
    # --------------------------------------------------------
    location /media/ {
        alias /var/www/myapp/media/;

        expires 7d;
        add_header Cache-Control "public";
    }

    # --------------------------------------------------------
    # Public cacheable API example
    #
    # IMPORTANT:
    # Only use this pattern for genuinely public GET/HEAD
    # endpoints. Do NOT blindly cache personalized/authenticated
    # responses.
    # --------------------------------------------------------
    location /api/public/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_cache django_cache;
        proxy_cache_methods GET HEAD;

        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 30s;

        proxy_cache_key "$scheme$request_method$host$request_uri";

        # Never share cached responses for authenticated requests.
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;

        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://django_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # --------------------------------------------------------
    # Normal Django/DRF API
    # No shared cache by default.
    # --------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://django_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # --------------------------------------------------------
    # Django admin
    # --------------------------------------------------------
    location /admin/ {
        proxy_pass http://django_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # --------------------------------------------------------
    # WebSockets / Django Channels
    # --------------------------------------------------------
    location /ws/ {
        proxy_pass http://django_backend;
        include /etc/nginx/snippets/websocket-params.conf;
    }

    # --------------------------------------------------------
    # Everything else -> Django
    # --------------------------------------------------------
    location / {
        proxy_pass http://django_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }
}

